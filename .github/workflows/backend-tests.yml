name: Backend tests

# When should this workflow run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest        # a fresh Linux machine every run

    defaults:
      run:
        working-directory: backend   # every "run:" step starts inside backend/

    steps:
      # 1. Copy your repo's code onto the fresh machine
      - uses: actions/checkout@v4

      # 2. Install Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. Install your dependencies (requirements.txt is relative to backend/)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the tests
      - name: Run tests
        run: pytest -v
